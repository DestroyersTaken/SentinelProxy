name: Build

on:
  push:
    branches: [main, "claude/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a GitHub Release with this version tag (e.g. v0.1.0); leave empty to just build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run check
          pnpm run build
      - name: Vet
        run: |
          go vet ./internal/...
          GOOS=windows go vet ./...
      - name: Test
        run: go test -race -count=1 ./internal/...
      - name: Live capture test (nftables)
        run: |
          sudo apt-get install -y nftables >/dev/null
          sudo env "PATH=$PATH" "HOME=$HOME" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" SENTINEL_LIVE=1 go test -count=1 -run TestLinuxLive ./internal/intercept/

  windows:
    name: Build (Windows x64)
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - name: Test on Windows
        run: go test -count=1 ./internal/...
      - name: WinDivert driver
        shell: pwsh
        run: ./scripts/fetch-windivert.ps1
      - name: Build
        shell: pwsh
        run: |
          $version = "${{ inputs.release }}"
          if (-not $version) { $version = (git describe --tags --always) }
          $version = $version -replace '^v', ''
          go run github.com/tc-hib/go-winres@v0.3.3 make --in build/windows/winres.json --out rsrc --arch amd64
          go build -trimpath -ldflags "-s -w -H windowsgui -X main.version=$version" -o dist/SentinelProxy/SentinelProxy.exe .
          Copy-Item third_party/windivert/* dist/SentinelProxy/
          Copy-Item README.md dist/SentinelProxy/
      - uses: actions/upload-artifact@v4
        with:
          name: SentinelProxy-windows-x64
          path: dist/SentinelProxy
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release || github.ref_name }}
        run: |
          $zip = "SentinelProxy-$env:TAG-windows-x64.zip"
          Compress-Archive dist/SentinelProxy/* $zip
          $notes = @"
          ## SentinelProxy $env:TAG

          Rule-based proxy routing for every app: an open alternative to Proxifier.

          **Install:** unzip anywhere and run ``SentinelProxy.exe``. Keep ``WinDivert.dll`` and ``WinDivert64.sys`` next to it.
          The local SOCKS5/HTTP proxy (127.0.0.1:2080) works right away; click **Restart as administrator** for system-wide capture of every app.

          **Note:** some games' anti-cheat may refuse to run while the WinDivert driver is loaded; turn capture off or use the local proxy port for those.

          Requires Windows 10/11 x64 with the WebView2 runtime (preinstalled on current Windows).
          "@
          gh release create $env:TAG $zip --target $env:GITHUB_SHA --title "SentinelProxy $env:TAG" --notes $notes --generate-notes
